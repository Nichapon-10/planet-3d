<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>ดาวเสาร์หัวใจสำหรับแฟน 💕</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #2d1b4e, #4a2c63);
      font-family: 'Arial', sans-serif;
    }
    #overlay {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      color: #ff69b4;
      font-size: 2.8em;
      font-weight: bold;
      text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493, 0 0 60px #ff69b4;
      z-index: 10;
      animation: heartbeat 1.5s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes heartbeat {
      0%, 100% { 
        transform: scale(1);
        text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
      }
      50% { 
        transform: scale(1.1);
        text-shadow: 0 0 30px #ff69b4, 0 0 60px #ff1493, 0 0 80px #ff69b4;
      }
    }
    #message {
      position: absolute;
      bottom: 50px;
      width: 100%;
      text-align: center;
      color: #ffb6c1;
      font-size: 1.5em;
      font-style: italic;
      opacity: 0;
      animation: fadeInOut 4s ease-in-out infinite;
    }
    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="overlay">💖 กดที่ดาวเลย 💖</div>
  <div id="message">สร้างด้วยความรักสำหรับคนพิเศษ 💕</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Scene
    const scene = new THREE.Scene();
    
    // Camera
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);
    
    // Renderer
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 1);
    document.body.appendChild(renderer.domElement);
    
    // ฟังก์ชันสร้างรูปหัวใจ 3D
    function createHeart3D(size = 1) {
      const heartShape = new THREE.Shape();
      const x = 0, y = 0;
      
      // สร้างรูปหัวใจที่สวยกว่า
      heartShape.moveTo(x, y + size * 0.5);
      heartShape.bezierCurveTo(x, y + size * 0.5, x - size * 0.5, y + size * 1.5, x - size * 0.5, y + size * 0.5);
      heartShape.bezierCurveTo(x - size * 0.5, y - size * 0.5, x, y - size * 0.5, x, y + size * 0.5);
      heartShape.bezierCurveTo(x, y - size * 0.5, x + size * 0.5, y - size * 0.5, x + size * 0.5, y + size * 0.5);
      heartShape.bezierCurveTo(x + size * 0.5, y + size * 1.5, x, y + size * 0.5, x, y + size * 0.5);
      
      const extrudeSettings = {
        depth: size * 0.3,
        bevelEnabled: true,
        bevelThickness: size * 0.1,
        bevelSize: size * 0.1,
        bevelOffset: 0,
        bevelSegments: 8
      };
      
      return new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
    }
    
    // ดาวเสาร์รูปหัวใจ
    const planetGeometry = createHeart3D(1.5);
    const planetMaterial = new THREE.MeshPhongMaterial({
      color: 0xff69b4,
      shininess: 100,
      specular: 0xffffff,
      transparent: true,
      opacity: 0.95
    });
    const planet = new THREE.Mesh(planetGeometry, planetMaterial);
    planet.castShadow = true;
    planet.receiveShadow = true;
    scene.add(planet);
    
    // วงแหวนรูปหัวใจ
    const rings = [];
    for(let i = 0; i < 5; i++) {
      const ringGeometry = new THREE.TorusGeometry(3 + i * 0.5, 0.1, 8, 100);
      const ringMaterial = new THREE.MeshPhongMaterial({
        color: new THREE.Color().setHSL(0.9 - i * 0.05, 0.9, 0.7),
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8 - i * 0.1,
        shininess: 100
      });
      const ring = new THREE.Mesh(ringGeometry, ringMaterial);
      ring.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.3;
      ring.rotation.z = (Math.random() - 0.5) * 0.2;
      rings.push(ring);
      scene.add(ring);
    }
    
    // ดาวหัวใจรอบ ๆ (เปลี่ยนจากสี่เหลี่ยมเป็นหัวใจ)
    const hearts = [];
    const heartCount = 80;
    
    for(let i = 0; i < heartCount; i++) {
      const heartGeometry = createHeart3D(0.1 + Math.random() * 0.1);
      
      const heartMaterial = new THREE.MeshPhongMaterial({
        color: new THREE.Color().setHSL(0.9 + Math.random() * 0.1, 0.8, 0.6 + Math.random() * 0.3),
        shininess: 100,
        transparent: true,
        opacity: 0.8 + Math.random() * 0.2
      });
      
      const heart = new THREE.Mesh(heartGeometry, heartMaterial);
      
      // วางตำแหน่งแบบสุ่มรอบ ๆ
      const radius = 8 + Math.random() * 25;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      
      heart.position.x = radius * Math.sin(phi) * Math.cos(theta);
      heart.position.y = radius * Math.sin(phi) * Math.sin(theta);
      heart.position.z = radius * Math.cos(phi);
      
      heart.lookAt(0, 0, 0);
      heart.rotation.z = Math.random() * Math.PI * 2;
      
      hearts.push({
        mesh: heart,
        originalPosition: heart.position.clone(),
        speed: 0.3 + Math.random() * 0.8,
        rotationSpeed: (Math.random() - 0.5) * 0.03,
        floatSpeed: Math.random() * 0.02 + 0.01,
        floatOffset: Math.random() * Math.PI * 2
      });
      
      scene.add(heart);
    }
    
    // ดาวพื้นหลังรูปหัวใจ
    const backgroundHearts = [];
    for(let i = 0; i < 30; i++) {
      const bgHeartGeometry = createHeart3D(0.05);
      const bgHeartMaterial = new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(0.85 + Math.random() * 0.15, 0.6, 0.4),
        transparent: true,
        opacity: 0.3
      });
      const bgHeart = new THREE.Mesh(bgHeartGeometry, bgHeartMaterial);
      
      bgHeart.position.x = (Math.random() - 0.5) * 100;
      bgHeart.position.y = (Math.random() - 0.5) * 100;
      bgHeart.position.z = (Math.random() - 0.5) * 100;
      
      backgroundHearts.push(bgHeart);
      scene.add(bgHeart);
    }
    
    // แสงไฟโรแมนติก
    const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
    scene.add(ambientLight);
    
    const pointLight1 = new THREE.PointLight(0xff69b4, 3, 100);
    pointLight1.position.set(15, 15, 15);
    pointLight1.castShadow = true;
    scene.add(pointLight1);
    
    const pointLight2 = new THREE.PointLight(0xff1493, 2, 80);
    pointLight2.position.set(-15, -15, 15);
    scene.add(pointLight2);
    
    const pointLight3 = new THREE.PointLight(0xffc0cb, 1.5, 60);
    pointLight3.position.set(0, 20, -10);
    scene.add(pointLight3);
    
    // ตัวแปรสำหรับอนิเมชั่น
    let isAnimating = false;
    let animationTime = 0;
    let planetRotation = 0;
    let cameraAnimation = false;
    let finalAnimation = false;
    
    // Mouse/Touch interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    function onPointerClick(event) {
      if (isAnimating) return;
      
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(planet);
      
      if (intersects.length > 0) {
        startAnimation();
      }
    }
    
    function startAnimation() {
      isAnimating = true;
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('message').style.display = 'none';
    }
    
    window.addEventListener('click', onPointerClick);
    window.addEventListener('touchstart', onPointerClick);
    
    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      
      const time = Date.now() * 0.001;
      
      if (isAnimating) {
        animationTime += 0.016;
        
        // ดาวเสาร์ค่อย ๆ ไกลออกไป
        if (!finalAnimation) {
          planet.position.z -= 0.08;
          rings.forEach(ring => {
            ring.position.z -= 0.08;
          });
        }
        
        // หัวใจวิ่งจากด้านหลังมาข้างหน้า
        hearts.forEach((heartObj, index) => {
          if (!finalAnimation) {
            heartObj.mesh.position.z += heartObj.speed;
          }
          
          // เคลื่อนไหวแบบลอยตัว
          heartObj.mesh.position.y += Math.sin(time * heartObj.floatSpeed + heartObj.floatOffset) * 0.01;
          heartObj.mesh.rotation.x += heartObj.rotationSpeed;
          heartObj.mesh.rotation.y += heartObj.rotationSpeed * 0.7;
          heartObj.mesh.rotation.z += heartObj.rotationSpeed * 0.3;
          
          // ถ้าหัวใจผ่านกล้องไปแล้ว ให้รีเซ็ตตำแหน่ง
          if (heartObj.mesh.position.z > 25) {
            heartObj.mesh.position.copy(heartObj.originalPosition);
            heartObj.mesh.position.z -= 40;
          }
        });
        
        // เมื่อดาวเสาร์ไกลพอแล้ว เริ่มแพนกล้อง
        if (planet.position.z < -25 && !cameraAnimation) {
          cameraAnimation = true;
        }
        
        if (cameraAnimation && !finalAnimation) {
          camera.position.y += 0.15;
          camera.position.z += 0.1;
          camera.lookAt(planet.position);
          
          // เมื่อกล้องเงยขึ้นมากพอ เริ่มจัดเรียงหัวใจเป็นรูปหัวใจใหญ่
          if (camera.position.y > 15) {
            finalAnimation = true;
            arrangeHeartsInHeartShape();
          }
        }
        
        if (finalAnimation) {
          // จัดเรียงหัวใจให้เป็นรูปหัวใจใหญ่
          hearts.forEach((heartObj, index) => {
            if (heartObj.targetPosition) {
              heartObj.mesh.position.lerp(heartObj.targetPosition, 0.02);
            }
          });
        }
      }
      
      // หมุนดาวเสาร์หัวใจ
      planetRotation += 0.008;
      planet.rotation.y = planetRotation;
      planet.rotation.x = Math.sin(time * 0.5) * 0.1;
      
      // เอฟเฟกต์เต้นของหัวใจ
      const heartbeat = 1 + Math.sin(time * 3) * 0.1;
      planet.scale.set(heartbeat, heartbeat, heartbeat);
      
      // หมุนวงแหวน
      rings.forEach((ring, index) => {
        ring.rotation.z += 0.003 * (index + 1);
        ring.rotation.y += 0.001 * (index + 1);
      });
      
      // เคลื่อนไหวหัวใจพื้นหลัง
      backgroundHearts.forEach((heart, index) => {
        heart.rotation.x += 0.005;
        heart.rotation.y += 0.003;
        heart.position.y += Math.sin(time + index) * 0.01;
      });
      
      // เอฟเฟกต์แสงไฟ
      pointLight1.intensity = 3 + Math.sin(time * 2) * 0.5;
      pointLight2.intensity = 2 + Math.cos(time * 1.5) * 0.3;
      pointLight3.intensity = 1.5 + Math.sin(time * 2.5) * 0.2;
      
      renderer.render(scene, camera);
    }
    
    // ฟังก์ชันจัดเรียงหัวใจเป็นรูปหัวใจใหญ่
    function arrangeHeartsInHeartShape() {
      hearts.forEach((heartObj, index) => {
        const t = (index / hearts.length) * Math.PI * 2;
        const scale = 8;
        
        // สมการรูปหัวใจ
        const x = scale * (16 * Math.pow(Math.sin(t), 3));
        const y = scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        const z = planet.position.z + (Math.random() - 0.5) * 5;
        
        heartObj.targetPosition = new THREE.Vector3(x * 0.3, y * 0.3, z);
      });
    }
    
    animate();
    
    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
